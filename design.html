<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Studio — KustomoImprenta Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div id="toast-box"></div>

<nav id="sidebar">
  <div class="sidebar-logo"><div class="logo-brand">KustomoImprenta</div><span class="logo-sub">Admin Panel</span></div>
  <ul class="sidebar-nav"></ul>
  <div class="sidebar-footer">
    <div class="admin-info"><div class="admin-avatar" id="admin-avatar">A</div><div><div class="admin-name" id="admin-name">—</div><div class="admin-role" id="admin-role">Admin</div></div></div>
    <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </div>
</nav>

<style>
  .ds-wrap { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }
  @media (max-width: 1100px) { .ds-wrap { grid-template-columns:minmax(0,1fr); } }
  .ds-stage-scroll { overflow:auto; padding:18px; display:flex; justify-content:center; }
  .ds-stage { position:relative; flex:0 0 auto; user-select:none; touch-action:none; cursor:default; }
  .ds-stage.drop { outline:2px dashed var(--orange); outline-offset:6px; }
  .ds-stage canvas { display:block; }
  .ds-swatches { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .ds-sw { width:24px; height:24px; border-radius:50%; border:1px solid #555; cursor:pointer; padding:0; }
  .ds-sw.on { box-shadow:0 0 0 2px var(--card-bg), 0 0 0 4px var(--orange); }
  .ds-shape-btn { width:44px; height:44px; border-radius:9px; background:var(--dark); border:1px solid var(--border); cursor:pointer; padding:6px; }
  .ds-shape-btn:hover { border-color:var(--orange); }
  .ds-shape-btn canvas { width:100%; height:100%; display:block; }
  .ds-panel label { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); display:block; margin:12px 0 5px; }
  .ds-panel input[type=text], .ds-panel input[type=number], .ds-panel textarea, .ds-panel select { width:100%; box-sizing:border-box; padding:8px 9px; border-radius:8px; background:var(--dark); color:var(--text); border:1px solid var(--border); font-size:14px; }
  .ds-panel input[type=range] { width:100%; accent-color:var(--orange); }
  .ds-panel input[type=color] { width:34px; height:26px; padding:0; border:1px solid var(--border); border-radius:6px; background:none; cursor:pointer; }
  .ds-range { display:grid; grid-template-columns:1fr 46px; gap:8px; align-items:center; }
  .ds-range span { font-size:12.5px; color:var(--muted); text-align:right; }
  .ds-layer { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:13.5px; cursor:pointer; }
  .ds-layer.on { border-color:var(--orange); background:rgba(255,92,0,.1); }
  .ds-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; align-items:end; }
  .ds-row .fg { margin:0; }
  #ds-product-row { grid-template-columns:minmax(220px,420px); }
  .ds-seg { display:flex; gap:4px; }
  .ds-seg button { flex:1; padding:6px; border-radius:7px; border:1px solid var(--border); background:var(--dark); color:var(--text); cursor:pointer; }
  .ds-seg button.on { border-color:var(--orange); background:rgba(255,92,0,.15); }
  .ds-two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ds-checks { display:flex; flex-wrap:wrap; gap:10px 16px; }
  .ds-checks label { text-transform:none; letter-spacing:0; font-size:13.5px; color:var(--text); margin:0; display:flex; gap:6px; align-items:center; font-weight:500; }
  .ds-layouts { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:260px; overflow:auto; }
  .ds-layout-btn { border:1px solid var(--border); border-radius:9px; background:#2a2a2a; padding:4px; cursor:pointer; }
  .ds-layout-btn:hover { border-color:var(--orange); }
  .ds-layout-btn canvas { width:100%; display:block; border-radius:6px; }
  .ds-layout-btn div { font-size:11.5px; color:var(--muted); padding:3px 2px 0; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>

<div id="main">
  <div class="topbar">
    <div class="topbar-title">Design Studio <span>Shop designs &amp; starting designs</span></div>
    <div class="topbar-right">
      <span id="ds-dirty" style="font-size:13.5px;color:var(--yellow);" hidden>Unsaved changes</span>
      <a class="btn-ghost" href="design-library.html"><i class="bi bi-collection"></i> Design library</a>
      <button class="btn-ghost" id="ds-remove" onclick="removeTarget()" hidden><i class="bi bi-trash3"></i> <span id="ds-remove-text">Remove starting design</span></button>
      <button class="btn-grad" id="ds-save" onclick="saveTarget()"><i class="bi bi-check-lg"></i> <span id="ds-save-text">Save to product</span></button>
    </div>
  </div>

  <div class="page-content">
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
          <div class="filter-bar" style="margin:0;" id="ds-modes" role="tablist">
            <button class="f-tab active" data-mode="product" role="tab"><i class="bi bi-box-seam"></i> Product starting design</button>
            <button class="f-tab" data-mode="preset" role="tab"><i class="bi bi-stars"></i> Shop designs</button>
          </div>
          <span id="ds-mode-help" style="font-size:13.5px;color:var(--muted);flex:1;min-width:240px;line-height:1.5;"></span>
        </div>
        <div id="ds-product-row" class="ds-row">
          <div class="fg"><label for="ds-product">Product</label><select id="ds-product"></select></div>
        </div>
        <div id="ds-preset-row" hidden>
          <div class="ds-row">
            <div class="fg"><label for="ds-preset">Shop design</label><select id="ds-preset"></select></div>
            <div class="fg"><label for="ds-model">Design it on</label><select id="ds-model"></select></div>
            <div class="fg"><label for="ds-pname">Name *</label><input type="text" id="ds-pname" maxlength="40" placeholder="e.g. Summer Vibes"></div>
            <div class="fg"><label for="ds-pcat">Category</label><input type="text" id="ds-pcat" maxlength="30" list="ds-cats" placeholder="e.g. Sports"><datalist id="ds-cats"></datalist></div>
          </div>
          <div class="ds-row" style="margin-top:12px;">
            <div class="fg"><label for="ds-pdesc">Short description</label><input type="text" id="ds-pdesc" maxlength="80" placeholder="Optional"></div>
            <div class="fg"><label for="ds-ptags">Search words</label><input type="text" id="ds-ptags" maxlength="120" placeholder="e.g. basketball, team, jersey"></div>
            <div class="fg"><label for="ds-pfor">Offered on</label><select id="ds-pfor"><option value="all">Every model</option><option value="this">Only the model it's designed on</option></select></div>
            <div class="fg"><label for="ds-porder">Position in the list</label><input type="number" id="ds-porder" min="0" max="9999" value="100"></div>
          </div>
          <div class="ds-row" style="margin-top:12px;">
            <div class="fg"><label for="ds-pstart">Show from (optional)</label><input type="datetime-local" id="ds-pstart"></div>
            <div class="fg"><label for="ds-pend">Show until (optional)</label><input type="datetime-local" id="ds-pend"></div>
            <div class="fg" style="grid-column:span 2;">
              <label>Customers may</label>
              <div class="ds-checks" style="padding-top:4px;">
                <label><input type="checkbox" id="ds-ptext" checked> change the words</label>
                <label><input type="checkbox" id="ds-pcolor" checked> change the colours</label>
                <label><input type="checkbox" id="ds-pactive" checked> see it (published)</label>
              </div>
            </div>
          </div>
          <div class="fg" style="margin-top:12px;">
            <label>Can be added to (none ticked = any side)</label>
            <div class="ds-checks" id="ds-pside"></div>
          </div>
        </div>
        <div class="filter-bar" style="margin:0;" id="ds-sides"></div>
      </div>
    </div>

    <div class="ds-wrap">
      <div class="card">
        <div class="card-head">
          <span class="card-title" id="ds-stage-title">Shirt</span>
          <span style="font-size:13.5px;color:var(--muted);">Drag to move · white dot resizes, orange dot turns · arrow keys nudge · drop an image on the picture</span>
        </div>
        <div class="ds-stage-scroll"><div class="ds-stage" id="ds-stage"><canvas id="ds-canvas"></canvas></div></div>
        <div id="ds-warn" style="padding:0 18px 14px;font-size:13px;color:var(--yellow);"></div>
      </div>

      <div class="card ds-panel">
        <div class="card-head"><span class="card-title">Add</span></div>
        <div style="padding:0 18px 16px;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-ghost" onclick="addText()"><i class="bi bi-fonts"></i> Text</button>
            <button class="btn-ghost" id="ds-upload-btn" onclick="document.getElementById('ds-file').click()"><i class="bi bi-upload"></i> Image</button>
            <button class="btn-ghost" onclick="toggleLayouts()"><i class="bi bi-layout-text-window"></i> Text layout</button>
            <input type="file" id="ds-file" accept="image/*" hidden>
          </div>
          <div id="ds-upload-status" style="font-size:13.5px;color:var(--muted);margin-top:8px;" role="status"></div>
          <div id="ds-layout-box" hidden><label>Text layouts</label><div class="ds-layouts" id="ds-layouts"></div></div>
          <label>Shapes</label>
          <div id="ds-shapes" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
          <div id="ds-color-box"><label>Shirt colour</label><div class="ds-swatches" id="ds-colors"></div></div>
        </div>

        <div class="card-head" style="border-top:1px solid var(--border);"><span class="card-title">Layers on this side</span></div>
        <div style="padding:0 18px 12px;" id="ds-layers"></div>

        <div class="card-head" style="border-top:1px solid var(--border);"><span class="card-title" id="ds-sel-title">Selected</span></div>
        <div style="padding:0 18px 18px;" id="ds-sel"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/studio-common.js"></script>
<script>
  // A design is saved in the same form the app's designer uses (products/{id}.defaultCustomization,
  // designPresets/{id}.customization): { apparelColorHex, shirtStyle, views: { Front: {texts[], images[], shapes[],
  // layerOrder[], locked[], area{}, ref{}}, … } }. Positions are px from the centre of the picture as drawn here;
  // `ref` records where the print area is in it (with 1 size unit = 1 px), and the app uses it to put everything on
  // the same spot of the shirt on any phone (DesignItems.kt fitTo). Drawing is shared with the app (studio-common.js).

  const STAGE_H = 520;
  const SHIRT_COLORS = [['#FFFFFF','White'],['#EEEEEE','Light Grey'],['#9E9E9E','Grey'],['#212121','Black'],['#1A3A6B','Navy'],
    ['#1565C0','Royal Blue'],['#34415E','Dark Navy'],['#1976D2','Light Blue'],['#00838F','Teal'],['#2E7D32','Forest Green'],
    ['#8D1B1B','Maroon'],['#D32F2F','Red'],['#FF5C00','Orange']];
  const INKS = Studio.DEFAULT_INKS;

  // ── Library shapes (filled polygons in a 0..1 square, the app's encoding) ──
  const ring = (n, r, start = -90) => Array.from({length:n}, (_, i) => { const a = (start + i*360/n) * Math.PI/180; return [0.5 + r*Math.cos(a), 0.5 + r*Math.sin(a)]; });
  const star = (n, R, r) => Array.from({length:n*2}, (_, i) => { const a = (-90 + i*180/n) * Math.PI/180, q = i % 2 ? r : R; return [0.5 + q*Math.cos(a), 0.5 + q*Math.sin(a)]; });
  const heart = () => Array.from({length:60}, (_, i) => { const t = i/60 * 2*Math.PI;
    const x = 16*Math.pow(Math.sin(t),3), y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return [0.5 + x/36, 0.47 - y/36]; });
  const F = pts => ({ filled: true, width: 0.05, color: null, opacity: 1, brush: 'pen', softness: 0, layer: 0, points: pts });
  const L = (pts, w = 0.07) => ({ filled: false, width: w, color: null, opacity: 1, brush: 'pen', softness: 0, layer: 0, points: pts });
  const SHAPES = [
    ['Circle', [F(ring(64, 0.46))]], ['Square', [F([[.06,.06],[.94,.06],[.94,.94],[.06,.94]])]],
    ['Triangle', [F([[.5,.06],[.96,.88],[.04,.88]])]], ['Star', [F(star(5, .48, .2))]], ['Heart', [F(heart())]],
    ['Diamond', [F([[.5,.03],[.84,.5],[.5,.97],[.16,.5]])]], ['Hexagon', [F(ring(6, .47, 0))]], ['Burst', [F(star(12, .48, .34))]],
    ['Arrow', [F([[.04,.38],[.56,.38],[.56,.18],[.96,.5],[.56,.82],[.56,.62],[.04,.62]])]],
    ['Ring', [L(ring(64, 0.42).concat([ring(64, 0.42)[0]]), 0.1)]], ['Line', [L([[.06,.5],[.94,.5]], 0.08)]],
    ['Wave', [L(Array.from({length:40}, (_, i) => [0.05 + i*0.9/39, 0.5 + 0.18*Math.sin(i/39*Math.PI*4)]), 0.08)]]
  ];

  // ── State ──
  let mode = 'product', models = [], model = null, presets = [], preset = null, products = [], product = null;
  let side = 'Front', sel = null, dirty = false, colorHex = '#FFFFFF';
  let views = {}, otherViews = {};
  let layouts = [];
  const $ = id => document.getElementById(id);
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const blank = () => Studio.normalizeView({});
  const sidesOf = m => DESIGN_SIDES.filter(s => modelSide(m, s));

  // ── Geometry: the stage is the model's picture for the side; offsets are px from its centre ──
  function geo(s = side) {
    const a = modelSide(model, s) || model.front;
    const h = STAGE_H, w = STAGE_H * a.w / a.h, zn = a.zone;
    const z = { left: zn.left*w - w/2, top: zn.top*h - h/2, width: (zn.right-zn.left)*w, height: (zn.bottom-zn.top)*h };
    return { art: a, w, h, zone: z };
  }

  // ── Pictures (the garment and uploaded images), loaded once ──
  const imgs = {};
  function want(url) {
    if (!url || imgs[url]) return;
    imgs[url] = { el: null, p: Studio.loadImage(url).then(el => { imgs[url].el = el; draw(); }).catch(() => { imgs[url].failed = true; draw(); }) };
  }
  const tintCache = {};
  function garment(g) {
    const art = imgs[g.art.img] && imgs[g.art.img].el; if (!art) return null;
    const key = g.art.img + '|' + (model.tintable === false ? '-' : colorHex) + '|' + Math.round(g.w);
    if (tintCache[key]) return tintCache[key];
    const cv = document.createElement('canvas'); const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr);
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    c.drawImage(art, 0, 0, g.w, g.h);
    if (model.tintable !== false) {
      c.globalCompositeOperation = 'source-in'; c.fillStyle = colorHex; c.fillRect(0, 0, g.w, g.h);
      c.globalCompositeOperation = 'multiply'; c.drawImage(art, 0, 0, g.w, g.h);
      c.globalCompositeOperation = 'destination-in'; c.drawImage(art, 0, 0, g.w, g.h);
    }
    return (tintCache[key] = cv);
  }
  const imageMap = v => { const m = {}; v.images.forEach(i => { const e = imgs[i.url]; if (e && e.el) m[i.id] = e.el; }); return m; };

  /** Half-size (px, unturned) of a layer, for selection and hit tests. */
  function halfOf(v, key, g) {
    const it = Studio.itemOf(v, key); if (!it) return [0, 0];
    if (key.startsWith('text:')) return Studio.textHalfSize(it, 1);
    if (key.startsWith('image:')) { const e = imgs[it.url] && imgs[it.url].el; return Studio.imageHalfSize(it, g.zone.width, e ? e.naturalWidth : 0, e ? e.naturalHeight : 0); }
    const h = Studio.shapeHalfSize(it, g.zone.width); return [h, h];
  }

  // ── Drawing the stage ──
  function draw() {
    if (!model) return;
    const g = geo(), v = views[side] || blank(), cv = $('ds-canvas'), dpr = window.devicePixelRatio || 1;
    $('ds-stage').style.width = g.w + 'px'; $('ds-stage').style.height = g.h + 'px';
    cv.style.width = g.w + 'px'; cv.style.height = g.h + 'px';
    cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gm = garment(g); if (gm) ctx.drawImage(gm, 0, 0, g.w, g.h);
    ctx.save();
    ctx.translate(g.w / 2, g.h / 2);
    const z = g.zone;
    // Print area outline
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(255,92,0,.85)'; ctx.lineWidth = 1.5; ctx.strokeRect(z.left, z.top, z.width, z.height); ctx.restore();
    // The design, trimmed to the print area like the print
    ctx.save(); ctx.beginPath(); ctx.rect(z.left, z.top, z.width, z.height); ctx.clip();
    Studio.drawSideItems(ctx, v, z.width, 1, imageMap(v));
    ctx.restore();
    // Selection frame and handles
    const box = selBox(g, v);
    if (box) {
      ctx.save(); ctx.translate(box.cx, box.cy); ctx.rotate(box.rot * Math.PI / 180);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(-box.hw, -box.hh, box.hw * 2, box.hh * 2);
      ctx.strokeStyle = 'rgba(255,92,0,.9)'; ctx.lineWidth = 3; ctx.globalAlpha = 0.6; ctx.strokeRect(-box.hw - 2, -box.hh - 2, box.hw * 2 + 4, box.hh * 2 + 4);
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(0, -box.hh); ctx.lineTo(0, -box.hh - 22); ctx.strokeStyle = '#FF5C00'; ctx.lineWidth = 2; ctx.stroke();
      dot(ctx, box.hw, box.hh, '#fff'); dot(ctx, 0, -box.hh - 26, '#FF5C00');
      ctx.restore();
    }
    ctx.restore();
    const failed = v.images.filter(i => imgs[i.url] && imgs[i.url].failed).length;
    $('ds-warn').textContent = failed ? `${failed} image${failed > 1 ? 's' : ''} on this side couldn't be loaded (the image host may not allow it).` : '';
  }
  function dot(ctx, x, y, fill) { ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#FF5C00'; ctx.stroke(); }
  function selBox(g, v) {
    if (!sel) return null;
    const it = Studio.itemOf(v, sel); if (!it) return null;
    const [hw, hh] = halfOf(v, sel, g);
    return { cx: it.offX, cy: it.offY, hw, hh, rot: it.rotation || 0 };
  }

  /** Loads what the side needs (fonts, pictures) and redraws everything. */
  async function render() {
    if (!model) return;
    const v = views[side] || blank();
    want(geo().art.img);
    v.images.forEach(i => want(i.url));
    await Studio.ensureFonts(v.texts);
    draw(); renderLayers(); renderSel(); renderChrome();
  }
  function renderChrome() {
    const what = mode === 'product' ? (product ? product.name : 'Product') : (($('ds-pname').value || '').trim() || 'New shop design');
    $('ds-stage-title').textContent = what + ' · ' + model.label + ' · ' + side;
    $('ds-dirty').hidden = !dirty;
    $('ds-remove').hidden = mode === 'product' ? !(product && product.defaultCustomization) : !preset;
    $('ds-remove-text').textContent = mode === 'product' ? 'Remove starting design' : 'Delete shop design';
    $('ds-save-text').textContent = mode === 'product' ? 'Save to product' : (preset ? 'Save shop design' : 'Publish shop design');
    $('ds-sides').innerHTML = sidesOf(model).map(s => `<button class="f-tab ${s === side ? 'active' : ''}" onclick="setSide('${s}')">${s}${views[s] && Studio.hasContent(views[s]) ? ' •' : ''}</button>`).join('');
    document.querySelectorAll('#ds-colors .ds-sw').forEach(b => b.classList.toggle('on', b.dataset.c === colorHex));
    $('ds-color-box').hidden = model.tintable === false;
  }
  function layerName(v, k) {
    const it = Studio.itemOf(v, k); if (!it) return '';
    if (k.startsWith('text:')) return '“' + it.text.replace(/\n/g, ' ').slice(0, 20) + '” · ' + Studio.fontLabel(it.font);
    if (k.startsWith('image:')) return 'Image';
    return it.name || 'Shape';
  }
  function renderLayers() {
    const v = views[side], keys = Studio.layerKeys(v).slice().reverse();
    $('ds-layers').innerHTML = keys.length ? keys.map(k => {
      const locked = v.locked.includes(k);
      return `<div class="ds-layer ${sel === k ? 'on' : ''}" onclick="select('${k}')">
         <i class="bi ${k.startsWith('image:') ? 'bi-image' : k.startsWith('text:') ? 'bi-fonts' : 'bi-star'}"></i>
         <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(layerName(v, k))}</span>
         <button class="btn-icon" title="${locked ? 'Unlock' : 'Lock'}" aria-label="${locked ? 'Unlock' : 'Lock'}" onclick="event.stopPropagation();toggleLock('${k}')"><i class="bi ${locked ? 'bi-lock-fill' : 'bi-unlock'}"></i></button>
         <button class="btn-icon" title="Bring forward" aria-label="Bring forward" onclick="event.stopPropagation();moveLayer('${k}',1)"><i class="bi bi-arrow-up"></i></button>
         <button class="btn-icon" title="Send back" aria-label="Send back" onclick="event.stopPropagation();moveLayer('${k}',-1)"><i class="bi bi-arrow-down"></i></button>
       </div>`; }).join('')
      : '<p style="font-size:14px;color:var(--muted);">Nothing on this side yet. Top of the list prints on top.</p>';
  }

  // ── The Selected panel ──
  const FMT = { raw: v => String(v), pct: v => Math.round(v * 100) + '%', deg: v => Math.round(v) + '°', px: v => Math.round(v) + 'px', dec: v => (+v).toFixed(2) };

  function renderSel() {
    const v = views[side], box = $('ds-sel'), it = sel && Studio.itemOf(v, sel);

        <button class="btn-ghost" onclick="duplicateSel()"><i class="bi bi-copy"></i> Duplicate</button>
        <button class="btn-ghost" onclick="centreSel()"><i class="bi bi-align-center"></i> Centre</button>

        <label>Colour</label>${swatches(it.colorHex, "c=>setT('colorHex',c)")}
        <label>Line up</label><div class="ds-seg">${['left','center','right'].map(a => `<button class="${it.align === a ? 'on' : ''}" onclick="setT('align','${a}');renderSel()"><i class="bi bi-text-${a === 'center' ? 'center' : a}"></i></button>`).join('')}</div>
        ${range('s-ls', 'Letter spacing', -0.1, 0.6, 0.01, it.letterSpacing, "v=>setT('letterSpacing',v)", dec)}

        ${(it.strokes || []).some(s => s.filled && !s.color) ? `<div class="ds-checks" style="margin-top:10px;"><label><input type="checkbox" ${it.outline ? 'checked' : ''} onchange="setS('outline',this.checked)"> Outline only</label></div>` : ''}
        ${ownColours && !(it.strokes || []).some(s => !s.color) ? '<p style="font-size:13px;color:var(--muted);margin-top:10px;">This drawing has its own colours.</p>' : `<label>Colour</label>${swatches(it.colorHex, "c=>setS('colorHex',c)")}`}

    }
  }

  // ── Editing ──
  const touch = () => { dirty = true; $('ds-dirty').hidden = false; };
  const cur = () => sel && Studio.itemOf(views[side], sel);
  function setT(k, val) { const t = cur(); if (!t) return; t[k] = val; touch(); draw(); if (k === 'text') renderLayers(); if (/Hex$/.test(k)) renderSel(); }
  async function setFont(id) { const t = cur(); if (!t) return; t.font = id; const f = Studio.fontById(id); if (!(f && f.builtIn && Object.keys(f.styles || {}).length)) { t.bold = false; t.italic = false; } touch(); await Studio.ensureFonts([t]); draw(); renderSel(); renderLayers(); }
  async function setFontStyle(k, on) { const t = cur(); if (!t) return; t[k] = on; touch(); await Studio.ensureFonts([t]); draw(); }
  function setI(k, val) { const i = cur(); if (!i) return; i[k] = val; touch(); draw(); }
  function setS(k, val) { const s = cur(); if (!s) return; s[k] = val; touch(); draw(); if (k === 'colorHex') renderSel(); }
  function select(k) { sel = k; draw(); renderLayers(); renderSel(); }
  function setSide(s) { side = s; sel = null; render(); }
  function center() { const z = geo().zone; return { x: z.left + z.width/2, y: z.top + z.height/2 }; }
  function addItem(kind, item) {
    const v = views[side];
    (kind === 'text' ? v.texts : kind === 'image' ? v.images : v.shapes).push(item);
    v.layerOrder = Studio.layerKeys(v).concat(kind + ':' + item.id);
    sel = kind + ':' + item.id; touch(); render();
  }
  function addText() {
    const c = center(), z = geo().zone, n = Studio.layerKeys(views[side]).length % 5 * 12;
    addItem('text', Studio.textFromMap({ id: Studio.newItemId(), text: 'Your text', font: Studio.DEFAULT_FONT_ID, size: Math.round(z.width * 0.11),
      colorHex: Studio.contrastInk(colorHex), offX: c.x + n, offY: c.y + n }));
    setTimeout(() => { const t = $('s-text'); if (t) { t.focus(); t.select(); } }, 50);
  }
  function addShape(i) {
    const c = center(), n = Studio.layerKeys(views[side]).length % 5 * 12;
    const strokes = SHAPES[i][1];
    addItem('shape', Studio.shapeFromMap({ id: Studio.newItemId(), name: SHAPES[i][0], path: Studio.encodeStrokes(strokes), colorHex: Studio.contrastInk(colorHex),
      offX: c.x + n, offY: c.y + n, kind: 'shape' }));
  }
  function addLayout(id) {
    const lay = layouts.find(l => l.id === id); if (!lay) return;
    const v = views[side], z = geo().zone;
    const texts = Studio.layoutToTexts(lay, z, 1, colorHex);
    texts.forEach(t => v.texts.push(t));
    v.layerOrder = Studio.layerKeys(v);
    sel = texts.length ? 'text:' + texts[texts.length - 1].id : null; touch(); render();
  }

    box.innerHTML = layouts.map(l => `<button class="ds-layout-btn" onclick="addLayout('${esc(l.id)}')" title="${esc(l.name)}"><canvas data-l="${esc(l.id)}" width="240" height="170"></canvas><div>${esc(l.name)}</div></button>`).join('');
    for (const cv of box.querySelectorAll('canvas')) {
      const lay = layouts.find(l => l.id === cv.dataset.l), z = { left: 15, top: 10, width: 210, height: 150 };
      const texts = Studio.layoutToTexts(lay, z, 1, '#2A2A2A');
      await Studio.ensureFonts(texts);

    }
  }
  function removeSel() {

    v.texts = v.texts.filter(t => 'text:' + t.id !== sel); v.images = v.images.filter(i => 'image:' + i.id !== sel); v.shapes = v.shapes.filter(s => 'shape:' + s.id !== sel);
    v.layerOrder = v.layerOrder.filter(k => k !== sel); v.locked = v.locked.filter(k => k !== sel);
    sel = null; touch(); render();
  }
  function duplicateSel() {
    const it = cur(); if (!it) return;
    const kind = sel.slice(0, sel.indexOf(':'));
    const copy = JSON.parse(JSON.stringify(it)); copy.id = Studio.newItemId(); copy.offX += 16; copy.offY += 16; copy.groupId = '';
    addItem(kind, copy);
  }
  function centreSel() { const it = cur(); if (!it) return; it.offX = center().x; touch(); draw(); }
  function moveLayer(k, step) {
    const v = views[side], keys = Studio.layerKeys(v), from = keys.indexOf(k); if (from < 0) return;
    const to = Math.min(keys.length - 1, Math.max(0, from + step)); if (to === from) return;
    keys.splice(from, 1); keys.splice(to, 0, k); v.layerOrder = keys; touch(); draw(); renderLayers();
  }
  function toggleLock(k) { const v = views[side]; v.locked = v.locked.includes(k) ? v.locked.filter(x => x !== k) : v.locked.concat(k); touch(); renderLayers(); }
  function setColor(c) { colorHex = c; touch(); draw(); renderChrome(); }

  // ── Uploads: the button, or an image file dropped on the shirt ──
  let replaceTarget = null;
  async function addImageFile(file, at) {
    if (!file || !/^image\//.test(file.type)) { toast('That file is not an image', 'warn'); return; }
    if (file.size > 10 * 1024 * 1024) { toast('Images can be up to 10 MB', 'warn'); return; }
    const status = $('ds-upload-status'), btn = $('ds-upload-btn');
    status.textContent = 'Uploading ' + file.name + '…'; btn.disabled = true;
    try {
      const url = await uploadDesignImage(file);
      const v = views[side], c = at || center();
      const old = replaceTarget && v.images.find(i => i.id === replaceTarget);
      if (old) { old.url = url; old.originalUrl = ''; sel = 'image:' + old.id; touch(); render(); }
      else addItem('image', Studio.imageFromMap({ id: Studio.newItemId(), url, offX: c.x, offY: c.y }));
      status.textContent = '';
    } catch (e) { status.textContent = ''; toast('Upload failed: ' + e.message, 'err'); }
    finally { btn.disabled = false; $('ds-file').value = ''; replaceTarget = null; }
  }
  $('ds-file').addEventListener('change', e => addImageFile(e.target.files[0]));
  const stage = $('ds-stage');
  ['dragenter','dragover'].forEach(n => stage.addEventListener(n, e => { e.preventDefault(); stage.classList.add('drop'); }));
  ['dragleave','drop'].forEach(n => stage.addEventListener(n, e => { e.preventDefault(); stage.classList.remove('drop'); }));
  stage.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
    const r = stage.getBoundingClientRect(), z = geo().zone;
    const x = Math.min(z.left + z.width, Math.max(z.left, e.clientX - r.left - r.width/2));
    const y = Math.min(z.top + z.height, Math.max(z.top, e.clientY - r.top - r.height/2));
    replaceTarget = null; addImageFile(f, { x, y });
  });
  ['dragover','drop'].forEach(n => window.addEventListener(n, e => e.preventDefault()));

  // ── Moving, resizing and turning on the picture ──
  let drag = null;
  function pointer(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left - r.width/2, y: e.clientY - r.top - r.height/2 }; }
  /** The top unlocked item under (x, y), in px from the stage centre. */
  function hit(x, y) {
    const v = views[side], g = geo(), keys = Studio.layerKeys(v).slice().reverse();
    for (const k of keys) {
      if (v.locked.includes(k)) continue;
      const it = Studio.itemOf(v, k), [hw, hh] = halfOf(v, k, g), a = -(it.rotation || 0) * Math.PI / 180;
      const dx = x - it.offX, dy = y - it.offY, lx = dx * Math.cos(a) - dy * Math.sin(a), ly = dx * Math.sin(a) + dy * Math.cos(a);
      if (Math.abs(lx) <= hw + 4 && Math.abs(ly) <= hh + 4) return k;
    }
    return null;
  }
  function handleAt(p) {
    const g = geo(), b = selBox(g, views[side]); if (!b) return null;
    const a = b.rot * Math.PI / 180, at = (lx, ly) => ({ x: b.cx + lx * Math.cos(a) - ly * Math.sin(a), y: b.cy + lx * Math.sin(a) + ly * Math.cos(a) });
    const size = at(b.hw, b.hh), rot = at(0, -b.hh - 26);
    if (Math.hypot(p.x - size.x, p.y - size.y) < 11) return { kind: 'size', b };
    if (Math.hypot(p.x - rot.x, p.y - rot.y) < 11) return { kind: 'rot', b };
    return null;
  }
  stage.addEventListener('pointerdown', e => {
    const p = pointer(e), v = views[side], h = handleAt(p);
    if (h) {
      const it = cur();
      drag = h.kind === 'size'
        ? { mode: 'size', cx: h.b.cx, cy: h.b.cy, d0: Math.hypot(p.x - h.b.cx, p.y - h.b.cy) || 1, v0: sel.startsWith('text:') ? it.size : it.scale }
        : { mode: 'rot', cx: h.b.cx, cy: h.b.cy, a0: Math.atan2(p.y - h.b.cy, p.x - h.b.cx), r0: it.rotation || 0 };
    } else {
      const k = hit(p.x, p.y);
      if (!k) { if (sel) select(null); return; }
      if (sel !== k) select(k);
      const it = cur();
      drag = { mode: 'move', dx: p.x - it.offX, dy: p.y - it.offY };
    }
    stage.setPointerCapture(e.pointerId); e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    const p = pointer(e);
    if (!drag) { stage.style.cursor = handleAt(p) ? 'pointer' : hit(p.x, p.y) ? 'grab' : 'default'; return; }
    const it = cur(); if (!it) return;
    const z = geo().zone;
    if (drag.mode === 'move') {
      // The item's centre stays inside the print area, as in the app
      it.offX = Math.min(z.left + z.width, Math.max(z.left, p.x - drag.dx));
      it.offY = Math.min(z.top + z.height, Math.max(z.top, p.y - drag.dy));
    } else if (drag.mode === 'size') {
      const k = Math.hypot(p.x - drag.cx, p.y - drag.cy) / drag.d0;
      if (sel.startsWith('text:')) it.size = Math.min(400, Math.max(4, drag.v0 * k));
      else it.scale = Math.min(5, Math.max(0.1, drag.v0 * k));
    } else {
      let r = drag.r0 + (Math.atan2(p.y - drag.cy, p.x - drag.cx) - drag.a0) * 180 / Math.PI;
      r = ((r + 540) % 360) - 180;
      if (e.shiftKey) r = Math.round(r / 15) * 15;
      it.rotation = Math.abs(r) < 3 ? 0 : r;
    }
    touch(); draw();
  });
  ['pointerup','pointercancel'].forEach(n => stage.addEventListener(n, () => { if (drag) { drag = null; renderSel(); } }));
  window.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || !sel) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSel(); return; }
    const step = e.shiftKey ? 10 : 1, it = cur(); if (!it) return;
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (d) { e.preventDefault(); it.offX += d[0]; it.offY += d[1]; touch(); draw(); }
  });

  // ── Loading a design onto the stage ──
  function loadDesignData(d, m) {
    model = m || models[0];
    const c = Studio.normalizeCustomization(d || {});
    colorHex = /^#[0-9a-f]{6}$/i.test(c.apparelColorHex) ? c.apparelColorHex.toUpperCase() : '#FFFFFF';
    views = {}; otherViews = {};
    const raw = (d && d.views) || {};
    Object.keys(raw).forEach(k => { if (!sidesOf(model).includes(k)) otherViews[k] = raw[k]; });
    sidesOf(model).forEach(s => {
      const v = c.views[s];
      views[s] = v ? Studio.fitTo(v, geo(s).zone, 1) : blank();
      if (v && !v.ref) {
        // Made before positions carried a reference: everything starts in the middle of the print area
        const z = geo(s).zone, cx = z.left + z.width / 2, cy = z.top + z.height / 2;
        views[s].texts.forEach(t => { t.offX = cx; t.offY = cy; });
        views[s].images.forEach(i => { i.offX = cx; i.offY = cy; });
        views[s].shapes.forEach((x, i) => { x.offX = cx + i * 10; x.offY = cy + i * 10; });
      }
    });
    side = 'Front'; sel = null; dirty = false; render();
  }
  function loadProduct(id) {
    product = products.find(p => p.id === id) || null;
    loadDesignData(product && product.defaultCustomization, product ? productModel(product, models) : null);
  }
  const toLocal = ts => { if (!ts || !ts.toDate) return ''; const d = ts.toDate(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
  function loadPreset(id) {
    preset = presets.find(p => p.id === id) || null;
    const wanted = $('ds-model').value;
    const c = preset ? (preset.customization || {}) : null;
    const m = (c && models.find(x => x.id === c.shirtStyle)) || models.find(x => x.id === wanted) || models[0];
    $('ds-model').value = m.id;
    $('ds-pname').value = preset ? (preset.name || '') : '';
    $('ds-pdesc').value = preset ? (preset.description || '') : '';
    $('ds-pcat').value = preset ? (preset.category || '') : '';
    $('ds-ptags').value = preset && Array.isArray(preset.tags) ? preset.tags.join(', ') : '';
    $('ds-pfor').value = preset && Array.isArray(preset.models) && preset.models.length ? 'this' : 'all';
    $('ds-porder').value = preset && typeof preset.order === 'number' ? preset.order : 100;
    $('ds-pstart').value = toLocal(preset && preset.startAt); $('ds-pend').value = toLocal(preset && preset.endAt);
    $('ds-ptext').checked = !preset || preset.editableText !== false;
    $('ds-pcolor').checked = !preset || preset.recolorable !== false;
    $('ds-pactive').checked = !preset || preset.isActive !== false;
    const allowed = preset && Array.isArray(preset.sides) ? preset.sides : [];
    $('ds-pside').innerHTML = DESIGN_SIDES.map(s => `<label><input type="checkbox" value="${s}" ${allowed.includes(s) ? 'checked' : ''} onchange="touch()"> ${s}</label>`).join('');
    loadDesignData(c, m);
  }
  function buildCustomization() {
    const out = { apparelColorHex: colorHex, shirtStyle: model.id, views: Object.assign({}, otherViews) };
    sidesOf(model).forEach(s => {
      const v = views[s]; if (!Studio.hasContent(v)) return;
      const z = geo(s).zone;
      // Where the print area is in this page's picture; sizes here are px, so 1 size unit = 1 px
      v.ref = { left: z.left, top: z.top, width: z.width, height: z.height, sp: 1 };
      out.views[s] = Studio.viewToMap(v);
    });
    return out;
  }

  // ── Saving ──
  const saveTarget = () => mode === 'product' ? saveDesign() : savePreset();
  const removeTarget = () => mode === 'product' ? removeDesign() : deletePreset();
  async function saveDesign() {
    if (!product) { toast('Pick a product first', 'warn'); return; }
    const data = buildCustomization();
    if (!Object.keys(data.views).length) { toast('The design is empty. Add something, or use Remove starting design.', 'warn'); return; }
    const btn = $('ds-save'); btn.disabled = true;
    try {
      await db.collection('products').doc(product.id).update({ defaultCustomization: data });
      product.defaultCustomization = data; dirty = false; toast('Saved. Customers will see it in the app.', 'ok'); renderChrome(); fillProductList();
    } catch (e) { toast('Not saved: ' + e.message, 'err'); }
    finally { btn.disabled = false; }
  }
  function confirmTwice(btnId, label, again) {
    const btn = $(btnId), text = $(btnId + '-text') || btn;
    if (btn.dataset.sure === '1') { btn.dataset.sure = ''; text.textContent = label; return true; }
    btn.dataset.sure = '1'; text.textContent = again;
    setTimeout(() => { if (btn.dataset.sure === '1') { btn.dataset.sure = ''; text.textContent = label; } }, 4000);
    return false;
  }
  async function removeDesign() {
    if (!product || !product.defaultCustomization) return;
    if (!confirmTwice('ds-remove', 'Remove starting design', 'Click again to remove')) return;
    try {
      await db.collection('products').doc(product.id).update({ defaultCustomization: firebase.firestore.FieldValue.delete() });
      delete product.defaultCustomization; toast('Starting design removed', 'ok'); loadProduct(product.id); fillProductList();
    } catch (e) { toast('Not removed: ' + e.message, 'err'); }
  }
  const fromLocal = s => s ? firebase.firestore.Timestamp.fromDate(new Date(s)) : null;
  async function savePreset() {
    const name = $('ds-pname').value.trim();
    if (!name) { toast('Give the design a name', 'warn'); $('ds-pname').focus(); return; }
    const data = buildCustomization();
    if (!Object.keys(data.views).length) { toast('The design is empty. Add text, a shape or an image first.', 'warn'); return; }
    const start = fromLocal($('ds-pstart').value), end = fromLocal($('ds-pend').value);
    if (start && end && end.seconds <= start.seconds) { toast('"Show until" must be after "Show from"', 'warn'); return; }
    const fields = {
      name, description: $('ds-pdesc').value.trim(), customization: data, isActive: $('ds-pactive').checked,
      models: $('ds-pfor').value === 'this' ? [model.id] : [],
      category: $('ds-pcat').value.trim(),
      tags: $('ds-ptags').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 20),
      sides: [...document.querySelectorAll('#ds-pside input:checked')].map(i => i.value),
      editableText: $('ds-ptext').checked, recolorable: $('ds-pcolor').checked,
      startAt: start, endAt: end, order: Math.max(0, Math.round(+$('ds-porder').value || 0)),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: (auth.currentUser && auth.currentUser.email) || ''
    };
    const btn = $('ds-save'); btn.disabled = true;
    try {
      if (preset) {
        await db.collection('designPresets').doc(preset.id).update(fields);
        toast('Saved. Customers see the change the next time they open Designs.', 'ok');
      } else {
        const ref = await db.collection('designPresets').add(Object.assign(fields, {
          thumbnailUrl: '', createdBy: auth.currentUser ? auth.currentUser.uid : '', createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }));
        preset = { id: ref.id };
        toast('Published. Customers see it under Designs › Shop designs in the app.', 'ok');
      }
      dirty = false;
      await loadPresets(preset.id);
    } catch (e) {
      toast(e && e.code === 'permission-denied' ? "Not saved: the database rules need updating (App Keys → For your developer)." : 'Not saved: ' + e.message, 'err');
    } finally { btn.disabled = false; }
  }
  async function deletePreset() {
    if (!preset) return;
    if (!confirmTwice('ds-remove', 'Delete shop design', 'Click again to delete')) return;
    try {
      await db.collection('designPresets').doc(preset.id).delete();
      toast('Shop design deleted', 'ok'); preset = null; dirty = false; await loadPresets('');
    } catch (e) { toast('Not deleted: ' + e.message, 'err'); }
  }
  Object.assign(window, { saveTarget, removeTarget, setT, setFont, setFontStyle, setI, setS, select, setSide, addText, addShape, addLayout,
    toggleLayouts, removeSel, duplicateSel, centreSel, moveLayer, toggleLock, setColor, renderSel, touch });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ── Setup ──
  $('ds-colors').innerHTML = SHIRT_COLORS.map(c => `<button class="ds-sw" data-c="${c[0]}" style="background:${c[0]};" title="${c[1]}" aria-label="${c[1]}" onclick="setColor('${c[0]}')"></button>`).join('');
  $('ds-shapes').innerHTML = SHAPES.map((s, i) => `<button class="ds-shape-btn" title="${s[0]}" aria-label="Add ${s[0]}" onclick="addShape(${i})"><canvas width="64" height="64"></canvas></button>`).join('');
  document.querySelectorAll('#ds-shapes canvas').forEach((cv, i) => Studio.drawStrokes(cv.getContext('2d'), SHAPES[i][1], 64, '#F0F0F0', false, []));
  let leaveArmed = '';
  function canLeave(key) {
    if (!dirty || leaveArmed === key) { leaveArmed = ''; return true; }
    leaveArmed = key; toast('You have unsaved changes. Do it again to leave them.', 'warn');
    setTimeout(() => { if (leaveArmed === key) leaveArmed = ''; }, 6000);
    return false;
  }
  $('ds-product').addEventListener('change', e => {
    if (!canLeave('p:' + e.target.value)) { e.target.value = product ? product.id : ''; return; }
    loadProduct(e.target.value);
  });
  $('ds-preset').addEventListener('change', e => {
    if (!canLeave('s:' + e.target.value)) { e.target.value = preset ? preset.id : ''; return; }
    loadPreset(e.target.value);
  });
  $('ds-model').addEventListener('change', e => {
    // Same design, moved onto the other model's picture
    const data = buildCustomization(), m = models.find(x => x.id === e.target.value) || models[0], wasDirty = dirty;
    loadDesignData(data, m); dirty = wasDirty || Object.keys(data.views).length > 0; renderChrome();
  });
  ['ds-pname', 'ds-pdesc', 'ds-pcat', 'ds-ptags', 'ds-porder', 'ds-pstart', 'ds-pend'].forEach(id => $(id).addEventListener('input', () => { touch(); renderChrome(); }));
  ['ds-pfor', 'ds-pactive', 'ds-ptext', 'ds-pcolor'].forEach(id => $(id).addEventListener('change', touch));

  const HELP = {
    product: "What customers see first when they open this product in the app's designer. They can change it.",
    preset: "Ready-made designs customers add to their shirt (Designs › Shop designs in the app). Design one, fill in its details and publish it."
  };
  function setMode(m) {
    if (m === mode) return;
    if (!canLeave('m:' + m)) return;
    mode = m;
    document.querySelectorAll('#ds-modes .f-tab').forEach(b => { b.classList.toggle('active', b.dataset.mode === m); b.setAttribute('aria-selected', b.dataset.mode === m); });
    $('ds-product-row').hidden = m !== 'product'; $('ds-preset-row').hidden = m !== 'preset';
    $('ds-mode-help').textContent = HELP[m];
    if (m === 'product') { if (product) loadProduct(product.id); else render(); }
    else loadPreset(preset ? preset.id : ($('ds-preset').value || ''));
  }
  document.querySelectorAll('#ds-modes .f-tab').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  function fillProductList() {
    $('ds-product').innerHTML = products.map(p => `<option value="${p.id}">${esc(p.name || p.id)} · ${esc(productModel(p, models).label)}${p.defaultCustomization ? ' (has a design)' : ''}${p.isAvailable === false ? ' (hidden)' : ''}</option>`).join('');
    if (product) $('ds-product').value = product.id;
  }
  async function loadPresets(selectId) {
    try {
      const snap = await db.collection('designPresets').get();
      presets = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (num(a.order, 100) - num(b.order, 100)) || (((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0)));
    } catch (e) { presets = []; toast("Couldn't load shop designs: " + e.message, 'err'); }
    const label = p => {
      const m = Array.isArray(p.models) && p.models.length ? models.find(x => x.id === p.models[0]) : null;
      return esc(p.name || 'Design') + (p.category ? ' · ' + esc(p.category) : '') + (m ? ' · ' + esc(m.label) + ' only' : '') + (p.isActive === false ? ' (draft)' : '');
    };
    $('ds-preset').innerHTML = '<option value="">＋ New shop design</option>' + presets.map(p => `<option value="${p.id}">${label(p)}</option>`).join('');
    $('ds-preset').value = presets.some(p => p.id === selectId) ? selectId : '';
    $('ds-cats').innerHTML = [...new Set(presets.map(p => p.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
    if (mode === 'preset') loadPreset($('ds-preset').value);
  }
  async function loadLayouts() {
    try {
      const snap = await db.collection('textLayouts').get();
      const docs = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(l => l.published !== false);
      layouts = snap.empty ? await Studio.starterLayouts() : docs;
    } catch (e) { layouts = await Studio.starterLayouts(); }
    layouts.sort((a, b) => num(a.order, 100) - num(b.order, 100));
  }

  window.onAuthReady = async () => {
    try {
      await Studio.loadFontList();
      models = (await loadModels()).filter(m => m.front);
      $('ds-model').innerHTML = models.map(m => `<option value="${m.id}">${esc(m.label)}${m.enabled ? '' : ' (hidden in the shop)'}</option>`).join('');
      model = models[0];
      loadLayouts();
      const snap = await db.collection('products').orderBy('name').get();
      products = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => productModel(p, models));
      fillProductList();
      $('ds-mode-help').textContent = HELP.product;
      const q = new URLSearchParams(location.search);
      await loadPresets(q.get('preset') || '');
      const first = products.find(p => p.id === q.get('product')) || products[0];
      if (first && !q.get('preset')) { $('ds-product').value = first.id; loadProduct(first.id); }
      if (q.get('mode') === 'preset' || q.get('preset') || !first) {
        if (!first) toast('No product has a model yet, so this opens on Shop designs. Add a product on the Products page.', 'warn');
        if (first && q.get('preset')) product = first;
        setMode('preset');
        if (q.get('model') && models.some(m => m.id === q.get('model'))) { $('ds-model').value = q.get('model'); loadPreset(''); }
      }
    } catch (e) { toast("Couldn't load the Design Studio: " + e.message, 'err'); }
  };
</script>
</body>
</html>
