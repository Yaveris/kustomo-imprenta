<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail — KustomoImprenta Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div id="toast-box"></div>

<nav id="sidebar">
  <div class="sidebar-logo"><div class="logo-brand">KustomoImprenta</div><span class="logo-sub">Admin Panel</span></div>
  <ul class="sidebar-nav"></ul>
  <div class="sidebar-footer">
    <div class="admin-info"><div class="admin-avatar" id="admin-avatar">A</div><div><div class="admin-name" id="admin-name">—</div><div class="admin-role" id="admin-role">Admin</div></div></div>
    <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </div>
</nav>

<div id="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">Order <span>Detail</span></div>
    <div class="topbar-right">
      <button class="btn-ghost" onclick="window.print()" title="Print a job sheet for the print floor"><i class="bi bi-printer"></i> Print</button>
      <a href="orders.html" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back to Orders</a>
    </div>
  </div>
  <div class="page-content" id="content"><div class="spinner"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/shop-map.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/studio-common.js"></script>
<script>
  const oid = new URLSearchParams(location.search).get('id');
  if (!oid) location.href = 'orders.html';

  let order = null, chatId = null, adminUid = null, unsubChat = null;

  auth.onAuthStateChanged(async u => {
    if (!u) return;
    adminUid = u.uid;
    await loadOrder();
  });

  async function loadOrder() {
    const doc = await db.collection('orders').doc(oid).get();
    if (!doc.exists) {
      document.getElementById('content').innerHTML = '<div class="empty"><i class="bi bi-x-circle"></i><p>Order not found</p></div>';
      return;
    }
    order = { id:doc.id, ...doc.data() };
    document.getElementById('page-title').innerHTML = `Order <span>${orderNo(oid)}</span>`;
    document.title = `Order ${orderNo(oid)} — KustomoImprenta Admin`;
    renderDetail();
    await setupChat();
  }

  /** Reads the order again and refreshes what a status change touches (badge, picker, stock line, history). */
  async function refreshStatus() {
    const doc = await db.collection('orders').doc(oid).get();
    if (!doc.exists) return;
    order = { id: doc.id, ...doc.data() };
    renderStatusParts();
    renderDriver();
  }
  function renderStatusParts() {
    const o = order, st = o.status || 'Pending';
    document.getElementById('sts-badge').innerHTML = statusBadge(st);
    document.getElementById('sts-sel').value = st;
    document.getElementById('stock-line').textContent = o.stockDeducted
      ? 'Deducted' + (o.stockDeductedAt ? ' on ' + fmtDate(o.stockDeductedAt) : '')
      : o.stockRestoredAt ? 'Returned on ' + fmtDate(o.stockRestoredAt) + ' (cancelled)'
      : st === 'Cancelled' ? 'Not deducted' : 'Comes off automatically in a moment';
    const bal = document.getElementById('bal-line');
    if (bal) bal.innerHTML = o.balancePaidAt
      ? `<span style="color:#00E676;"><i class="bi bi-check-circle"></i> Collected ${fmtDate(o.balancePaidAt)}${o.balancePaidBy ? ' by ' + esc(o.balancePaidBy) : ''}</span>
         <button class="btn-ghost no-print" style="margin-left:8px;padding:3px 9px;font-size:13px;" onclick="markBalance(false)">Undo</button>`
      : `<span style="color:var(--yellow);">${peso(o.remainingAmount)} still to collect</span>
         <button class="btn-grad no-print" style="margin-left:8px;padding:4px 11px;font-size:13px;" onclick="markBalance(true)"><i class="bi bi-cash-coin"></i> Mark as collected</button>`;
    document.getElementById('upd-line').textContent = o.updatedAt ? fmtDate(o.updatedAt) : 'Not yet';
    const hist = (Array.isArray(o.statusHistory) ? o.statusHistory : []).slice()
      .sort((a, b) => (a.at && a.at.toMillis ? a.at.toMillis() : 0) - (b.at && b.at.toMillis ? b.at.toMillis() : 0));
    const steps = [{ status: 'Placed', at: o.orderedAt, by: o.fullName || 'Customer' }].concat(hist);
    document.getElementById('history').innerHTML = steps.map(h => {
      const key = String(h.status || '').toLowerCase();
      return `<li><span class="dot" style="color:var(--s-${key === 'placed' ? 'pending' : esc(key)},var(--muted));"></span>
        <div><strong>${esc(h.status === 'Ready' ? 'Ready for pickup' : h.status || '')}</strong>
        <div style="font-size:13px;color:var(--muted);">${h.at ? fmtDate(h.at) : ''}${h.by ? ' · ' + esc(h.by) : ''}</div></div></li>`;
    }).join('') + (hist.length ? '' : '<li class="note" style="display:block;">Status changes made from now on are listed here.</li>');
  }

  async function saveNotes() {
    const btn = document.getElementById('notes-btn'), text = document.getElementById('notes').value.trim();
    btn.disabled = true;
    try {
      await db.collection('orders').doc(oid).update({ adminNotes: text, adminNotesAt: firebase.firestore.FieldValue.serverTimestamp(),
        adminNotesBy: (auth.currentUser && auth.currentUser.email) || '' });
      order.adminNotes = text;
      document.getElementById('notes-state').textContent = 'Saved just now';
      toast('Notes saved', 'ok');
    } catch (e) { toast('Not saved: ' + e.message, 'err'); }
    finally { btn.disabled = false; }
  }

  const hexOk = h => (typeof h === 'string' && /^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(h)) ? h : '';

  /** One side of a customer's design (front, back, a sleeve): a preview drawn the way the app prints it, what is on
   *  it, the inks it needs, what the app's print check warned about, and its print-ready files. */
  function renderSide(side, raw, idx) {
    const v = Studio.normalizeView(raw);
    if (!Studio.hasContent(v)) return '';
    const texts = v.texts.filter(t => t.text.trim());
    const dot = h => `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${h};border:1px solid var(--border);vertical-align:middle;"></span>`;
    const inks = Studio.inksOf(v);
    const shapeNames = v.shapes.map(sh => sh.name).filter(Boolean);
    const key = idx + '|' + side;
    return `
      <div style="display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.03);">
        <div class="pv-box" data-k="${esc(key)}" style="width:120px;height:120px;flex:0 0 120px;border-radius:6px;background:repeating-conic-gradient(#3a3a3a 0% 25%, #2a2a2a 0% 50%) 50% / 16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;"><div class="spinner" style="width:20px;height:20px;"></div></div>
        <div style="font-size:13.5px;line-height:1.55;flex:1;min-width:0;">
          <div style="font-weight:700;">${esc(side)} <span class="pv-size" data-k="${esc(key)}" style="font-weight:400;color:var(--muted);font-size:12.5px;"></span></div>
          ${texts.map(t => `<div>Text: "${esc(t.text.replace(/\n/g, ' / '))}" <span style="color:var(--muted);">· ${esc(Studio.fontLabel(t.font))}${t.effect && t.effect !== 'none' ? ' · ' + esc(t.effect) : ''} ${dot(t.colorHex)}</span></div>`).join('')}
          ${v.images.map((im, i) => { const u = safeUrl(im.url); return u ? `<div>Picture ${v.images.length > 1 ? i + 1 : ''}: <a href="${u}" target="_blank" rel="noopener" style="color:var(--orange);">open original file</a></div>` : ''; }).join('')}
          ${v.shapes.length ? `<div style="color:var(--muted);">${v.shapes.length} drawing${v.shapes.length > 1 ? 's / shapes' : ' / shape'}${shapeNames.length ? ': ' + esc(shapeNames.slice(0, 6).join(', ')) : ''}</div>` : ''}
          ${inks.length ? `<div style="margin-top:3px;"><span style="color:var(--muted);">Inks:</span> ${inks.map(i => `${dot(i.hex)} <span style="font-family:monospace;font-size:12px;">${i.hex}</span>`).join(' &nbsp;')}${v.images.length ? ' <span style="color:var(--muted);">+ full-colour picture</span>' : ''}</div>` : ''}
          ${v.printWarnings.length ? `<div style="margin-top:4px;color:var(--yellow);font-size:13px;"><i class="bi bi-exclamation-triangle"></i> The app's print check: ${v.printWarnings.map(esc).join(' · ')}</div>` : ''}
          <div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
            <button class="btn-ghost" style="padding:4px 10px;font-size:13px;" onclick="downloadSide(${idx},'${esc(side)}','png')"><i class="bi bi-filetype-png"></i> PNG</button>
            <button class="btn-ghost" style="padding:4px 10px;font-size:13px;" onclick="downloadSide(${idx},'${esc(side)}','pdf')"><i class="bi bi-filetype-pdf"></i> PDF</button>
          </div>
        </div>
      </div>`;
  }

  // ── Print files: each side at its real size (the model's print width in cm) at the chosen resolution ──
  let printModels = null;
  const printOpts = () => ({
    dpi: +((document.getElementById('pf-dpi') || {}).value || 300),
    mirror: !!(document.getElementById('pf-mirror') || {}).checked,
    label: (document.getElementById('pf-label') || { checked: true }).checked
  });
  function modelForItem(it) {
    const c = it.customization || {};
    return (printModels || []).find(m => m.id === c.shirtStyle) || (printModels || []).find(m => m.id === guessShirtStyle(it.productName || '', '')) || null;
  }
  /** The side as a print-ready canvas, with its size in cm (0 when the model's print width isn't set). */
  async function printCanvas(idx, side, opts) {
    const it = order.items[idx], v = Studio.normalizeView(((it.customization || {}).views || {})[side]);
    const art = modelSide(modelForItem(it), side);
    let size;
    if (art) size = Studio.printPixels(art, opts.dpi);
    else {
      // No picture of this side to measure: keep the shape it was designed against, 3000 px wide
      const r = v.ref || { width: 1, height: 1 };
      size = { w: 3000, h: Math.round(3000 * r.height / r.width), cmW: 0, cmH: 0, known: false };
    }
    const cv = await Studio.renderZone(v, size.w, size.h, { mirror: opts.mirror });
    return { cv, size, v };
  }
  const fileBase = (idx, side) => `${orderNo(oid)}_item${idx + 1}_${side.replace(/\s+/g, '')}`;
  function loadScript(src) {
    return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load " + src)); document.head.appendChild(s); });
  }
  const JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  const JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  const toBlob = cv => new Promise((res, rej) => { try { cv.toBlob(b => b ? res(b) : rej(new Error('Empty picture')), 'image/png'); } catch (e) { rej(new Error("A picture in this design can't be copied into a file (its host doesn't allow it). Use “open original file” instead.")); } });
  function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  async function pdfOf(idx, side, opts) {
    await loadScript(JSPDF);
    const { cv, size, v } = await printCanvas(idx, side, opts);
    const wMm = size.known ? size.cmW * 10 : size.w / opts.dpi * 25.4, hMm = size.known ? size.cmH * 10 : size.h / opts.dpi * 25.4;
    const extra = opts.label ? 14 : 0;
    const pdf = new window.jspdf.jsPDF({ orientation: wMm > hMm + extra ? 'l' : 'p', unit: 'mm', format: [wMm, hMm + extra], compress: true });
    pdf.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, wMm, hMm, undefined, 'FAST');
    if (opts.label) {
      const inks = Studio.inksOf(v).map(i => i.hex).join(' ');
      pdf.setFontSize(9);
      pdf.text(`${orderNo(oid)} · item ${idx + 1} · ${side} · ${(wMm / 10).toFixed(1)} × ${(hMm / 10).toFixed(1)} cm${opts.mirror ? ' · MIRRORED' : ''}`, 4, hMm + 6);
      if (inks) pdf.text('Inks: ' + inks, 4, hMm + 11);
    }
    return { blob: pdf.output('blob'), failed: cv.failedImages || [] };
  }
  async function downloadSide(idx, side, kind) {
    const opts = printOpts();
    toast('Making the ' + side + ' print file…');
    try {
      let failed = [];
      if (kind === 'pdf') { const r = await pdfOf(idx, side, opts); failed = r.failed; save(r.blob, fileBase(idx, side) + '.pdf'); }
      else {
        const { cv, size } = await printCanvas(idx, side, opts);
        failed = cv.failedImages || [];
        save(await toBlob(cv), `${fileBase(idx, side)}_${size.known ? size.cmW.toFixed(1) + 'x' + size.cmH.toFixed(1) + 'cm_' : ''}${opts.dpi}dpi${opts.mirror ? '_mirrored' : ''}.png`);
      }
      toast(failed.length ? `Saved, but ${failed.length} picture(s) couldn't be included. Download them with “open original file”.` : 'Print file saved', failed.length ? 'warn' : 'ok');
    } catch (e) { toast('Not made: ' + e.message, 'err'); }
  }
  async function downloadItemZip(idx) {
    const opts = printOpts(), it = order.items[idx];
    const sides = Object.keys((it.customization || {}).views || {}).filter(k => Studio.hasContent(Studio.normalizeView(it.customization.views[k])));
    if (!sides.length) return;
    toast('Making print files for ' + sides.length + ' side(s)…');
    try {
      await loadScript(JSZIP);
      const zip = new JSZip(); let notes = `${orderNo(oid)} · item ${idx + 1} · ${it.productName || ''} · size ${it.size || '—'} × ${it.quantity || 1}\n`;
      for (const side of sides) {
        const { cv, size, v } = await printCanvas(idx, side, opts);
        zip.file(`${fileBase(idx, side)}_${opts.dpi}dpi${opts.mirror ? '_mirrored' : ''}.png`, await toBlob(cv));
        notes += `\n${side}: ${size.known ? size.cmW.toFixed(1) + ' × ' + size.cmH.toFixed(1) + ' cm' : size.w + ' × ' + size.h + ' px (print width not set)'}`;
        notes += `\n  Inks: ${Studio.inksOf(v).map(i => i.hex).join(', ') || '—'}${v.images.length ? ' + full-colour picture' : ''}`;
        if (v.printWarnings.length) notes += `\n  Print check: ${v.printWarnings.join(' | ')}`;
        if ((cv.failedImages || []).length) notes += `\n  NOT INCLUDED (download separately): ${cv.failedImages.join(', ')}`;
      }
      zip.file('job.txt', notes + '\n');
      save(await zip.generateAsync({ type: 'blob' }), `${orderNo(oid)}_item${idx + 1}_print_files.zip`);
      toast('Print files saved', 'ok');
    } catch (e) { toast('Not made: ' + e.message, 'err'); }
  }
  /** Draws every side's preview and shows its print size. */
  async function renderPreviews() {
    if (!printModels) printModels = await loadModels();
    for (const box of document.querySelectorAll('.pv-box')) {
      const [idx, side] = [+box.dataset.k.split('|')[0], box.dataset.k.split('|').slice(1).join('|')];
      try {
        const it = order.items[idx], art = modelSide(modelForItem(it), side);
        const v = Studio.normalizeView(((it.customization || {}).views || {})[side]);
        const r = art ? { w: (art.zone.right - art.zone.left) * art.w, h: (art.zone.bottom - art.zone.top) * art.h } : (v.ref ? { w: v.ref.width, h: v.ref.height } : { w: 1, h: 1 });
        const k = 240 / Math.max(r.w, r.h);
        const cv = await Studio.renderZone(v, r.w * k, r.h * k);
        cv.style.cssText = 'max-width:100%;max-height:100%;';
        box.innerHTML = ''; box.appendChild(cv);
        const sz = document.querySelector(`.pv-size[data-k="${CSS.escape(box.dataset.k)}"]`);
        if (sz) sz.textContent = art && art.cm ? `· print area ${art.cm.toFixed(1)} × ${(art.cm * r.h / r.w).toFixed(1)} cm` : '· print width not set for this model';
      } catch (e) { box.innerHTML = '<i class="bi bi-image" title="Preview unavailable"></i>'; }
    }
  }
  Object.assign(window, { downloadSide, downloadItemZip });

  /** An order line: what to make (product, style, colour, size), the customer's design and their notes. */
  function renderItem(it) {
    const c = it.customization || {};
    const color = hexOk(it.colorHex) || hexOk(c.apparelColorHex);
    const style = shirtStyleLabel(c.shirtStyle);
    const views = c.views || {};
    const idx = (order.items || []).indexOf(it);
    const order4 = k => { const i = DESIGN_SIDES.indexOf(k); return i < 0 ? 9 : i; };
    const sides = Object.keys(views).sort((a, b) => order4(a) - order4(b)).map(k => renderSide(k, views[k] || {}, idx)).filter(Boolean);
    // The app's Fit Scan adds the customer's measurements to the notes: "[Scanned Measurements - …]" from the camera,
    // "[Entered Measurements - …]" when typed in (older versions: "[Manual Entry - …]")
    const notes = it.notes || '';
    const fit = notes.match(/\[(Scanned Measurements|Entered Measurements|Typed Measurements|Manual Entry) - ([^\]]*)\]/);
    const customerNotes = (fit ? notes.replace(fit[0], '') : notes).trim().replace(/^(AR Scanned Fit|Manual Entry Fit)$/, '');
    const measurements = fit ? fit[2].trim() : '';
    const fitLabel = fit && fit[1].startsWith('Scanned') ? 'Fit Scan (camera)' : 'Fit Scan (typed in)';
    const thumb = safeUrl(it.imageUrl);
    return `
      <div class="item-row" style="align-items:flex-start;">
        <div class="item-ico">${thumb ? `<img src="${thumb}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" onerror="this.replaceWith('👕')">` : '👕'}</div>
        <div style="flex:1;">
          <div class="item-name">${esc(it.productName||'Product')}</div>
          <div class="item-meta">Size: ${esc(it.size||'—')} · Qty: ${it.quantity||1}${style?` · Style: ${esc(style)}`:''}${color?` · Colour: <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${color};border:1px solid var(--border);vertical-align:middle;"></span> ${color}`:''}${it.customText?` · Text: "${esc(it.customText)}"`:''}</div>
          ${sides.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">${sides.join('')}</div>
            <div class="no-print" style="margin-top:8px;"><button class="btn-ghost" style="padding:5px 11px;font-size:13px;" onclick="downloadItemZip(${idx})"><i class="bi bi-file-zip"></i> All print files (ZIP)</button></div>` : ''}
          ${customerNotes ? `<div style="font-size:13.5px;margin-top:8px;"><span style="color:var(--muted);">Notes:</span> ${esc(customerNotes)}</div>` : ''}
          ${measurements ? `<div style="font-size:13.5px;margin-top:4px;"><span style="color:var(--muted);"><i class="bi bi-rulers"></i> ${fitLabel}:</span> ${esc(measurements)}</div>` : ''}
        </div>
        <div class="item-price">${peso((it.price||0)*(it.quantity||1))}</div>
      </div>`;
  }

  function renderDetail() {
    const o = order;
    const items = o.items || [];
    const isDP  = o.isDownpayment;

    document.getElementById('content').innerHTML = `
      <div class="detail-grid">

        <!-- LEFT -->
        <div style="display:flex;flex-direction:column;gap:18px;">

          <div class="print-only" style="margin-bottom:12px;">
            <div style="font-size:20px;font-weight:800;">Job sheet · ${orderNo(oid)}</div>
            <div style="font-size:13px;">Printed ${fmtDate(new Date())}</div>
          </div>

          <!-- Order Info -->
          <div class="card">
            <div class="card-head">
              <span class="card-title">Order Information</span>
              <div style="display:flex;align-items:center;gap:10px;">
                <span id="sts-badge">${statusBadge(o.status||'Pending')}</span>
                <select id="sts-sel" aria-label="Order status" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:13.5px;outline:none;" onchange="updateStatus(this.value)">
                  ${ALL_STATUSES.map(s=>`<option value="${s}"${(o.status||'Pending')===s?' selected':''}>${s==='Ready'?'Ready for pickup':s}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="info-grid">
              <div class="ii"><label>Order No.</label><span style="font-family:monospace;">${orderNo(oid)}</span></div>
              ${o.payMongoSourceId?`<div class="ii"><label>PayMongo reference</label><span style="font-family:monospace;font-size:13px;word-break:break-all;">${esc(o.payMongoSourceId)}</span></div>`:''}
              <div class="ii"><label>Ordered On</label><span>${fmtDate(o.orderedAt)}</span></div>
              <div class="ii"><label>Status last changed</label><span id="upd-line"></span></div>
              <div class="ii"><label>Stock</label><span id="stock-line"></span></div>
              <div class="ii"><label>Customer</label><span>${esc(o.fullName||'—')}${o.userId?` · <a class="no-print" href="customers.html?uid=${encodeURIComponent(o.userId)}" style="color:var(--orange);">Profile</a>`:''}</span></div>
              <div class="ii"><label>Payment</label><span><i class="bi ${/cash on delivery|cod/i.test(o.paymentMethod||'')?'bi-cash-coin':'bi-phone'}" style="color:var(--orange);"></i> ${esc(o.paymentMethod||'GCash')}</span></div>
              <div class="ii"><label>Payment Type</label><span>${isDP?dpPct(o)+'% Downpayment':'Full Payment'}</span></div>
            </div>
          </div>

          <!-- Delivery: where it goes, how far, and who takes it -->
          <div class="card" id="delivery-card">
            <div class="card-head"><span class="card-title"><i class="bi bi-truck" style="color:var(--orange);margin-right:6px;"></i>Delivery</span><span id="drv-pill"></span></div>
            <div class="dlv-grid">
              <div>
                <div class="dlv-addr" id="dlv-addr"></div>
                <div class="dlv-btns no-print" id="dlv-btns"></div>
                <div class="dlv-dist" id="dlv-dist"></div>
              </div>
              <div class="dlv-map no-print" id="dlv-map"></div>
            </div>
            <div class="drv-box" id="driver-box"></div>
          </div>

          <!-- Items -->
          <div class="card">
            <div class="card-head"><span class="card-title">Order Items (${items.length})</span>
              <div class="no-print" style="display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;" title="Settings for the print files">
                <label style="display:flex;gap:5px;align-items:center;">Print files <select id="pf-dpi" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 5px;"><option value="300">300 dpi</option><option value="200">200 dpi</option><option value="150">150 dpi</option></select></label>
                <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="pf-mirror"> Mirror (transfers)</label>
                <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="pf-label" checked> Order label on PDF</label>
              </div></div>
            ${items.map(renderItem).join('')}

            <div class="totals">
              <div class="tot-row"><span class="lbl">Subtotal</span><span>${peso(o.subtotal)}</span></div>
              <div class="tot-row"><span class="lbl">Shipping</span><span>${+(o.shippingFee||0)===0?'<span style="color:#00E676;">FREE</span>':peso(o.shippingFee)}</span></div>
              <div class="tot-row grand"><span class="lbl">Total</span><span class="val">${peso(o.totalAmount)}</span></div>
              ${isDP?`
              <div class="tot-row"><span class="lbl" style="color:var(--yellow);">Downpayment (${dpPct(o)}%)</span><span style="color:var(--yellow);">${peso(o.downpaymentAmount)}</span></div>
              <div class="tot-row"><span class="lbl">Balance on delivery</span><span>${peso(o.remainingAmount)}</span></div>
              <div class="tot-row"><span class="lbl">Balance</span><span id="bal-line"></span></div>`:''}
            </div>
            ${isDP?`<div class="dp-notice"><i class="bi bi-wallet2"></i> ${dpPct(o)}% was paid through GCash. Collect the other ${peso(o.remainingAmount)} on delivery or pickup, then press <strong>Mark as collected</strong>.</div>`:''}
          </div>

          <!-- Staff notes: only seen on this site -->
          <div class="card">
            <div class="card-head"><span class="card-title"><i class="bi bi-journal-text" style="color:var(--orange);"></i> Staff notes</span>
              <span class="note" id="notes-state">${o.adminNotesAt?'Saved '+fmtDate(o.adminNotesAt)+(o.adminNotesBy?' by '+esc(o.adminNotesBy):''):'Not shown in the app'}</span></div>
            <div style="padding:0 18px 16px;">
              <textarea id="notes" class="inp" rows="3" maxlength="2000" placeholder="Print instructions, pickup arrangements, what was agreed in chat… (not shown in the app)" style="width:100%;">${esc(o.adminNotes||'')}</textarea>
              <button class="btn-ghost no-print" id="notes-btn" style="margin-top:8px;" onclick="saveNotes()"><i class="bi bi-check-lg"></i> Save notes</button>
            </div>
          </div>

          <!-- Status history -->
          <div class="card no-print">
            <div class="card-head"><span class="card-title"><i class="bi bi-clock-history" style="color:var(--orange);"></i> Status history</span></div>
            <div style="padding:0 18px 16px;"><ul class="timeline" id="history"></ul></div>
          </div>

        </div><!-- /left -->

        <!-- RIGHT: Chat -->
        <div class="card no-print" style="display:flex;flex-direction:column;height:fit-content;">
          <div class="card-head" style="margin-bottom:12px;">
            <span class="card-title"><i class="bi bi-chat-dots" style="color:var(--orange);"></i> Order Chat</span>
            <span style="font-size:13px;color:var(--muted);">● Live</span>
          </div>
          <div class="chat-wrap" id="chat-wrap"><div class="spinner" style="margin:20px auto;"></div></div>
          <div class="quick-replies" id="quick-replies"></div>
          <div class="chat-row">
            <textarea id="chat-in" placeholder="Type a message… (Enter to send)" rows="1"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
            <button class="btn-send" onclick="sendMsg()"><i class="bi bi-send-fill"></i></button>
          </div>
        </div>

      </div>`;
    renderStatusParts();
    renderDelivery();
    renderDriver();
    renderQuickReplies('quick-replies', 'chat-in');
    renderPreviews();
  }

  // ── Delivery: the address, the distance from the shop, and the driver ─────────────────────────────
  function renderDelivery() {
    const o = order, lines = orderAddressLines(o), phone = String(o.phone || '').trim();
    document.getElementById('dlv-addr').innerHTML = lines.length || o.landmark
      ? `<div class="dlv-name">${esc(o.fullName || 'Customer')}</div>${lines.map(l => `<div>${esc(l)}</div>`).join('')}
         ${o.landmark ? `<div class="dlv-land"><i class="bi bi-signpost"></i> ${esc(o.landmark)}</div>` : ''}
         ${phone ? `<div class="dlv-phone"><i class="bi bi-telephone"></i> ${esc(phone)}</div>` : ''}`
      : '<div class="note">No delivery address on this order.</div>';
    const tel = phone.replace(/[^\d+]/g, '');
    document.getElementById('dlv-btns').innerHTML = (lines.length ? `<button class="btn-ghost" onclick="copyAddress()"><i class="bi bi-clipboard"></i> Copy address</button>` : '')
      + (tel ? `<a class="btn-ghost" href="tel:${esc(tel)}"><i class="bi bi-telephone"></i> Call</a>` : '')
      + (lines.length || orderPin(o) ? `<a class="btn-ghost" id="dlv-dir" href="${esc(directionsUrl(null, o))}" target="_blank" rel="noopener"><i class="bi bi-sign-turn-right"></i> Directions</a>` : '');
    showDistance();
  }
  /** Name, phone, address and landmark, ready to paste into a courier app or a message. */
  function copyAddress() {
    const o = order;
    const text = [o.fullName, String(o.phone || '').trim()].filter(Boolean).join(' · ') + '\n' + orderAddressLines(o).join('\n') + (o.landmark ? '\nLandmark: ' + o.landmark : '')
      + (orderPin(o) ? `\nhttps://www.google.com/maps/search/?api=1&query=${orderPin(o).lat},${orderPin(o).lng}` : '');
    navigator.clipboard.writeText(text.trim()).then(() => toast('Address copied', 'ok'), () => toast("Couldn't copy. Select the address and copy it instead.", 'warn'));
  }
  let distToken = 0;
  async function showDistance() {
    const token = ++distToken, box = document.getElementById('dlv-dist'), o = order;
    box.innerHTML = '<span class="note"><i class="bi bi-hourglass-split"></i> Working out the distance…</span>';
    const [shop, dest] = await Promise.all([loadShopLocation().catch(() => null), orderPoint(o)]);
    if (token !== distToken) return;
    const dir = document.getElementById('dlv-dir'); if (dir) dir.href = directionsUrl(shop, o);
    const approx = dest && dest.approx ? `<div class="note" style="margin-top:4px;"><i class="bi bi-info-circle"></i> The customer didn't drop a pin, so this is ${dest.from === 'area' ? 'measured to their barangay' : 'found from the written address'} and may be off.</div>` : '';
    const setBtn = `<button class="linkbtn" onclick="setShopLocation()">${shop ? 'Change your location' : 'Set your shop\'s location'}</button>`;
    if (!shop) box.innerHTML = `<div class="dlv-km muted"><i class="bi bi-shop"></i> Set your shop's location to see how far this is.</div><div style="margin-top:4px;">${setBtn}</div>`;
    else if (!dest) box.innerHTML = `<div class="dlv-km muted"><i class="bi bi-question-circle"></i> This address couldn't be found on the map.</div><div class="note" style="margin-top:4px;">Use Directions to search it in Google Maps. ${setBtn}</div>`;
    else {
      const straight = distanceKm(shop, dest);
      box.innerHTML = `<div class="dlv-km"><i class="bi bi-signpost-split"></i> <b>${fmtKm(straight)}</b> from your shop <span class="note">(straight line)</span></div><div class="note" id="dlv-road">Checking the road distance…</div>${approx}<div class="note no-print" style="margin-top:4px;">${shop.mine ? 'From the location on your account · ' : ''}${setBtn}</div>`;
    }
    let route = null;
    if (shop && dest) {
      try { route = await roadRoute(shop, dest); } catch (e) { route = null; }
      if (token !== distToken) return;
      const road = document.getElementById('dlv-road');
      if (road) road.innerHTML = route ? `By road: <b style="color:var(--text);">${fmtKm(route.km)}</b>, about ${fmtMinutes(route.minutes)} by car` : 'The road distance isn\'t available right now.';
    }
    const mapEl = document.getElementById('dlv-map');
    if (!shop && !dest) { mapEl.hidden = true; return; }
    mapEl.hidden = false;
    drawDeliveryMap(mapEl, shop, dest, route).catch(e => { mapEl.innerHTML = `<div class="note" style="padding:14px;">${esc(e.message)}</div>`; });
  }
  async function setShopLocation() { if (await pickShopLocation()) showDistance(); }

  const recentDrivers = () => { try { return JSON.parse(localStorage.getItem('recent-drivers') || '[]').filter(d => d && d.name); } catch (e) { return []; } };
  function rememberDriver(d) {
    try { const list = [d].concat(recentDrivers().filter(x => x.name.toLowerCase() !== d.name.toLowerCase())).slice(0, 8); localStorage.setItem('recent-drivers', JSON.stringify(list)); } catch (e) {}
  }
  let driverEditing = false;
  function renderDriver() {
    const d = order.driver && order.driver.name ? order.driver : null, st = order.status || 'Pending';
    const pill = document.getElementById('drv-pill');
    pill.innerHTML = d ? '<span class="pill ok"><i class="bi bi-person-check-fill"></i> Driver assigned</span>'
      : st === 'Cancelled' ? '' : `<span class="pill ${st === 'Ready' ? 'warn' : ''}"><i class="bi bi-person-dash"></i> No driver yet</span>`;
    const box = document.getElementById('driver-box');
    if (d && !driverEditing) {
      const tel = String(d.phone || '').replace(/[^\d+]/g, '');
      box.innerHTML = `<div class="drv-head yes"><i class="bi bi-person-check-fill"></i> Driver assigned</div>
        <div class="drv-who"><b>${esc(d.name)}</b>${d.phone ? ` · ${tel ? `<a href="tel:${esc(tel)}">${esc(d.phone)}</a>` : esc(d.phone)}` : ''}${d.vehicle ? ` · ${esc(d.vehicle)}` : ''}</div>
        <div class="note">Assigned${d.assignedAt && d.assignedAt.toDate ? ' ' + fmtDate(d.assignedAt) : ''}${d.assignedBy ? ' by ' + esc(d.assignedBy) : ''}</div>
        <div class="drv-btns no-print"><button class="btn-ghost" onclick="tellCustomer()"><i class="bi bi-chat-text"></i> Tell the customer</button>
          <button class="btn-ghost" onclick="driverEditing=true;renderDriver()"><i class="bi bi-pencil"></i> Change</button>
          <button class="btn-ghost" onclick="removeDriver()"><i class="bi bi-x-lg"></i> Remove</button></div>`;
      return;
    }
    const recent = recentDrivers();
    box.innerHTML = `<div class="drv-head ${d ? 'yes' : 'no'}"><i class="bi ${d ? 'bi-pencil' : 'bi-person-dash'}"></i> ${d ? 'Change the driver' : st === 'Cancelled' ? 'No driver (order cancelled)' : 'No driver assigned yet'}</div>
      <div class="drv-form no-print">
        <div class="fg"><label for="drv-name">Driver's name *</label><input id="drv-name" maxlength="60" list="drv-recent" placeholder="e.g. Mark Reyes" value="${esc(d ? d.name : '')}" autocomplete="off"></div>
        <div class="fg"><label for="drv-phone">Phone</label><input id="drv-phone" maxlength="30" inputmode="tel" placeholder="09XX XXX XXXX" value="${esc(d ? d.phone || '' : '')}"></div>
        <div class="fg"><label for="drv-vehicle">Plate or booking no. <span class="note">(optional)</span></label><input id="drv-vehicle" maxlength="60" placeholder="e.g. NAB 1234 or Lalamove #" value="${esc(d ? d.vehicle || '' : '')}"></div>
        <datalist id="drv-recent">${recent.map(r => `<option value="${esc(r.name)}">`).join('')}</datalist>
      </div>
      <div class="drv-btns no-print"><button class="btn-grad" id="drv-save" onclick="saveDriver()"><i class="bi bi-person-check"></i> ${d ? 'Save driver' : 'Assign driver'}</button>
        ${d ? '<button class="btn-ghost" onclick="driverEditing=false;renderDriver()">Cancel</button>' : ''}</div>`;
    const nameIn = document.getElementById('drv-name');
    nameIn.addEventListener('change', () => {
      const r = recentDrivers().find(x => x.name.toLowerCase() === nameIn.value.trim().toLowerCase());
      if (r) { if (!document.getElementById('drv-phone').value) document.getElementById('drv-phone').value = r.phone || ''; if (!document.getElementById('drv-vehicle').value) document.getElementById('drv-vehicle').value = r.vehicle || ''; }
    });
  }
  async function saveDriver() {
    const name = document.getElementById('drv-name').value.trim().replace(/\s+/g, ' ');
    const phone = document.getElementById('drv-phone').value.trim(), vehicle = document.getElementById('drv-vehicle').value.trim();
    if (!name) { toast("Type the driver's name", 'warn'); document.getElementById('drv-name').focus(); return; }
    if (phone && !/^[\d\s()+-]{7,30}$/.test(phone)) { toast('Check the phone number', 'warn'); document.getElementById('drv-phone').focus(); return; }
    const btn = document.getElementById('drv-save'); btn.disabled = true;
    try {
      await db.collection('orders').doc(oid).update({ driver: { name, phone, vehicle, assignedAt: firebase.firestore.FieldValue.serverTimestamp(), assignedBy: (auth.currentUser && auth.currentUser.email) || '' } });
      rememberDriver({ name, phone, vehicle });
      driverEditing = false;
      toast('Driver assigned: ' + name, 'ok');
      await refreshStatus();
    } catch (e) { toast('Not saved: ' + e.message, 'err'); btn.disabled = false; }
  }
  async function removeDriver() {
    if (!confirm('Remove the driver from this order?')) return;
    try { await db.collection('orders').doc(oid).update({ driver: firebase.firestore.FieldValue.delete() }); toast('Driver removed', 'ok'); await refreshStatus(); }
    catch (e) { toast('Not saved: ' + e.message, 'err'); }
  }
  /** Puts a message with the driver's details in the chat box, to check and send. */
  function tellCustomer() {
    const d = order.driver || {}, inp = document.getElementById('chat-in');
    inp.value = `Your order ${orderNo(oid)} is on its way! Your driver is ${d.name}` + (d.phone ? ` (${d.phone})` : '') + (d.vehicle ? `, ${d.vehicle}` : '') + '.';
    inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight + 2) + 'px';
    inp.focus(); inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
    toast('Check the message, then press send', 'ok');
  }

  /** Share of the total paid up front, for orders placed with a downpayment. */
  function dpPct(o) { return o.totalAmount > 0 ? Math.round((o.downpaymentAmount || 0) / o.totalAmount * 100) : 50; }

  async function updateStatus(s) {
    const q = statusChangeQuestion(orderNo(oid), order.status, s);
    if (q && !confirm(q)) { document.getElementById('sts-sel').value = order.status || 'Pending'; return; }
    try {
      await setOrderStatus(oid, s);
      toast(`Status changed to "${s === 'Ready' ? 'Ready for pickup' : s}"`, 'ok');
      if (s === 'Delivered' && order.isDownpayment && !order.balancePaidAt &&
          confirm(`Was the balance of ${peso(order.remainingAmount)} collected? Press OK to mark it as collected.`)) {
        await setBalanceCollected(oid, true);
      }
    } catch(e) {
      toast('Update failed: ' + e.message,'err');
    }
    await refreshStatus().catch(() => {});
  }

  async function markBalance(collected) {
    if (!collected && !confirm('Mark the balance as not collected yet?')) return;
    try { await setBalanceCollected(oid, collected); toast(collected ? 'Balance marked as collected' : 'Balance marked as not collected', 'ok'); }
    catch (e) { toast('Not saved: ' + e.message, 'err'); }
    await refreshStatus().catch(() => {});
  }

  async function setupChat() {
    const snap = await db.collection('chats').where('orderId','==',oid).limit(1).get();
    if (!snap.empty) {
      chatId = snap.docs[0].id;
    } else {
      const ref = await db.collection('chats').add({
        orderId: oid, userId: order.userId||'',
        customerName: order.fullName||'',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        adminReadAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      chatId = ref.id;
    }
    subscribeChat();
  }

  function subscribeChat() {
    if (unsubChat) unsubChat();
    unsubChat = db.collection('chats').doc(chatId).collection('messages')
      .orderBy('sentAt','asc').onSnapshot(snap=>{
        renderMsgs(snap.docs.map(d=>({id:d.id,...d.data()})));
      });
    // Seen while this page shows it: clears the conversation's unread mark on the Messages page
    db.collection('chats').doc(chatId).onSnapshot(d => { chatDoc = d.data() || {}; if (chatIsUnread(chatDoc)) markChatRead(chatId); });
  }
  let chatDoc = null;
  document.addEventListener('visibilitychange', () => { if (chatDoc && chatIsUnread(chatDoc)) markChatRead(chatId); });

  function renderMsgs(msgs) {
    const wrap = document.getElementById('chat-wrap');
    if (!wrap) return;
    if (!msgs.length) {
      wrap.innerHTML='<div style="text-align:center;color:var(--muted);font-size:14px;padding:30px 0;">No messages yet — start the conversation!</div>';
      return;
    }
    wrap.innerHTML = msgs.map(m=>{
      const isA = m.senderRole==='admin';
      const t   = m.sentAt ? fmtDate(m.sentAt) : '';
      if (m.isDesignSubmission) return `
        <div class="cmsg user-msg">
          <div class="cavatar">C</div>
          <div>
            <div class="design-box">
              <div style="color:#8B5CF6;font-weight:600;margin-bottom:6px;font-size:13.5px;"><i class="bi bi-image"></i> Design Submission</div>
              ${safeUrl(m.imageUrl)?`<a href="${safeUrl(m.imageUrl)}" target="_blank" rel="noopener"><img src="${safeUrl(m.imageUrl)}" alt="design"></a>`:''}
              ${m.messageText?`<p style="font-size:14px;margin:5px 0;">${esc(m.messageText)}</p>`:''}
              <div style="font-size:13px;color:var(--muted);margin-bottom:5px;">Status: <strong style="color:${m.approvalStatus==='Approved'?'#00E676':m.approvalStatus==='Rejected'?'#FF4444':'var(--yellow)'};">${m.approvalStatus||'Pending Approval'}</strong></div>
              ${!m.approvalStatus||m.approvalStatus==='Pending Approval'?`
                <div style="display:flex;gap:7px;margin-top:7px;">
                  <button class="btn-ok" onclick="handleDesign('${m.id}',true)"><i class="bi bi-check-lg"></i> Approve</button>
                  <button class="btn-no" onclick="handleDesign('${m.id}',false)"><i class="bi bi-x-lg"></i> Reject</button>
                </div>`:''}
            </div>
            <div class="ctime">${t}</div>
          </div>
        </div>`;
      return `
        <div class="cmsg ${isA?'admin-msg':'user-msg'}">
          <div class="cavatar">${isA?'A':'C'}</div>
          <div>
            <div class="cbubble">${esc(m.messageText||'')}</div>
            <div class="ctime">${t}</div>
          </div>
        </div>`;
    }).join('');
    wrap.scrollTop = wrap.scrollHeight;
  }

  async function sendMsg() {
    const inp = document.getElementById('chat-in');
    const txt = (inp.value||'').trim();
    if (!txt || !chatId) return;
    inp.value = '';
    try {
      await db.collection('chats').doc(chatId).collection('messages').add({
        senderId: adminUid, senderRole:'admin',
        messageText: txt,
        sentAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('chats').doc(chatId).update({lastMessageAt:firebase.firestore.FieldValue.serverTimestamp(),adminReadAt:firebase.firestore.FieldValue.serverTimestamp()});
    } catch(e) { toast('Send failed','err'); inp.value=txt; }
  }

  async function handleDesign(msgId, approved) {
    try { await reviewDesign(chatId, msgId, approved, adminUid); } catch(e) { toast('Action failed: ' + e.message,'err'); }
  }
</script>
</body>
</html>
